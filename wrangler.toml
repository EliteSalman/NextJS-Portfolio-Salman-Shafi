# Build-safe Cloudflare configuration.
# The Worker entrypoint is supplied by wrangler.deploy.toml after Astro builds it.
"$schema" = "./node_modules/wrangler/config-schema.json"
name = "astro-portfolio"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[cache]
enabled = true
